name: MLOps CI

on:
  push:
  pull_request:

jobs:
  pipeline-smoke:
    name: Train + evaluate smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Pipeline smoke (default config)
        run: uv run mlops-train --config configs/default.yaml
