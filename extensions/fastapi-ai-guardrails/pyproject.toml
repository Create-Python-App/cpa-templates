[project]
name = "fastapi-ai-guardrails"
version = "0.1.0"
description = "FastAPI AI extension with guardrails for input/output validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
