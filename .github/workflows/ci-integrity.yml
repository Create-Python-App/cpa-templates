name: CI Integrity (L0)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    name: Registry + profiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CI dependencies
        run: pip install -r scripts/ci/requirements.txt

      - name: Validate templates.json (on-disk paths + categories)
        run: python scripts/ci/validate-registry.py

      - name: Validate curated CI profiles
        run: python scripts/ci/generate-matrix.py --layer validate-profiles
