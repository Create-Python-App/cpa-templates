[project]
name = "django-api"
version = "0.1.0"
description = "Django API starter scaffolded with create-awesome-python-app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1.0",
  "djangorestframework>=3.15.0",
  "drf-spectacular>=0.27.0",
  "gunicorn>=23.0.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "django-stubs>=6.0.7",
  "djangorestframework-stubs>=3.17.0",
  "mypy>=2.3.0",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-django>=4.12.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["apps", "config", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.12"
files = ["apps", "config", "tests"]
exclude = ["docs/"]
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings"
