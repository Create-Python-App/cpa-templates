[project]
name = "fastapi-starter"
version = "0.1.0"
description = "FastAPI API starter scaffolded with create-awesome-python-app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.2.2",
  "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.9.1",
  "mypy>=2.3.0",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
warn_return_any = true
warn_unused_configs = true
